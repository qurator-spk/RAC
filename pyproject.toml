[build-system]
requires = ["setuptools>=61.0", "wheel"]

[project]
name = "RAC"
authors = [
    {name = "Kai Labusch"},
    {name = "Staatsbibliothek zu Berlin - Preußischer Kulturbesitz"},
]
description = "Reading Order Article Coherence Toolbox"
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.11"
keywords = []

dynamic = ["dependencies", "version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
evaluate-article-matching = "rac.article_separation:evaluate_matching_result"
extract-article-separation = "rac.article_separation:extract_article_separation"
match-article-sequences = "rac.article_separation:match_article_sequences"
compile-article-separation-gt = "rac.article_separation:compile_article_separation_gt"
download-w3c-annotation-images = "rac.article_separation:download_w3c_annotation_images"
scan-graph-regions-ocr-database = "rac.image_scanner:scan_images_ocr_database"

[project.urls]
Homepage = "https://github.com/qurator-spk/RAC"
Repository = "https://github.com/qurator-spk/RAC.git"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", '*.yml', '*.xml', '*.xsd']

